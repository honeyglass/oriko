# Runs the same checks in every repository, so a commit made past lean-code's commit tool, such
# as one from a pull request, cannot bring in a file that fails the format, lint, typecheck or tests.
name: ci

# pull_request, never pull_request_target. The second one runs in the context of the
# target repository, with a writable token and the secrets in reach, while checking out
# the fork's code. That is the Pwn Request pattern.
on:
  push:
    branches: [main]
  pull_request:

# Read only, for the whole file. A workflow that cannot write cannot be turned into one
# that pushes, tags or opens a release.
permissions:
  contents: read

jobs:
  checks:
    # The runner is a setting of each repository. A repository whose tests need macOS adds
    # macos-latest to the list.
    strategy:
      # Every runner finishes, so a repository with two runners sees both results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 24 is the oldest Node oriko supports; lts/* is always the newest LTS.
        node: ['24', 'lts/*']
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to a commit, not to a tag. A tag can be moved to another commit by
      # anyone who gains write access to the action's repository, and every workflow
      # that names the tag then runs their code on the next push. That is how
      # tj-actions/changed-files was compromised in March 2025. A commit id addresses
      # the content and cannot be moved. The comment is for readers and for
      # Dependabot, which replaces the id and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this the job's token is left in .git/config and every later step,
          # including anything a dependency runs, can read and use it.
          persist-credentials: false
      # The supply check before the install, so a local link or a pnpm setting outside the
      # template fails the job before any dependency is fetched. It is pinned to a pushed
      # commit of honeyglass/actions whose CI was green. The action sets up Node 24 and pnpm
      # through Corepack, which refuses a pnpm whose sha512 differs from the one in
      # package.json, and leaves both on for the steps below.
      - uses: honeyglass/actions/supply-check@d775cff14274bc10b5efcf9ad1826455f1ecde18
      - run: pnpm install --frozen-lockfile
      # Right after the install, before the steps below run code from node_modules: a link
      # there that dangles or leads out of the checkout fails the job.
      - uses: honeyglass/actions/supply-check@d775cff14274bc10b5efcf9ad1826455f1ecde18
        with:
          mode: links
      # Each supply check sets up Node 24 again, so the Node of this runner comes after the last.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --version && pnpm --version
      # The test script measures coverage with --experimental-test-coverage. On the newest LTS this
      # step fails once Node offers a stable --test-coverage, so the script switches in time.
      - if: matrix.node == 'lts/*'
        run: |
          if node --help | grep -qE '^ +--test-coverage( |$)'; then
            echo '::error::Node has a stable --test-coverage; replace --experimental-test-coverage in package.json'
            exit 1
          fi
      - run: pnpm run format:check
      # Every repository names its scripts lint, typecheck and test, so this file stays the
      # same everywhere. --if-present skips the step in a repository without that script.
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present test

  # The quickstart's install script, on the commit of this run, in empty home folders on both
  # systems the script supports. The supply check runs first, as the script installs the
  # dependencies, and sets up Node 24 and Corepack for it.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: honeyglass/actions/supply-check@d775cff14274bc10b5efcf9ad1826455f1ecde18
      - run: sh tests/e2e/install.e2e.sh

  # The quickstart line of the README as a user runs it, against what GitHub serves for main.
  # Only after a push to main, once the other jobs passed, as GitHub serves only main. The two
  # variables keep the skills CLI the script runs out of the install counts of skills.sh.
  quickstart:
    if: github.event_name == 'push'
    needs: [checks, install]
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: curl -fsSL https://raw.githubusercontent.com/honeyglass/oriko/main/install.sh | sh
      - run: ~/.local/bin/oriko schema

  # The skills CLI behind skills.sh finds the skill of this commit, after lint and tests passed.
  # --list installs nothing, and the two variables keep the run out of the install counts that
  # skills.sh ranks by. The CLI is pinned to a version at least three days old. The skill is
  # copied to a folder without oriko in its path, so only the skill's own name can match.
  skill:
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - shell: bash
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          cp -R .claude "$RUNNER_TEMP/source/"
          npx --yes skills@1.8.1 add "$RUNNER_TEMP/source" --list | tee "$RUNNER_TEMP/list.txt"
          grep -qw oriko "$RUNNER_TEMP/list.txt"
